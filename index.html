<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DhanFlow Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
    }

    .hidden {
      display: none !important;
    }

    button {
      cursor: pointer;
    }

    /* LOGIN */
    #loginPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #0f172a, #2563eb);
    }

    .loginBox {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: #2563eb;
      margin-bottom: 5px;
    }

    .loginSubtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #2563eb;
    }

    .btn {
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      color: white;
      background: #2563eb;
      font-weight: bold;
      font-size: 15px;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .full {
      width: 100%;
      margin-top: 18px;
    }

    .success {
      background: #16a34a;
    }

    .danger {
      background: #dc2626;
    }

    .warning {
      background: #d97706;
    }

    .gray {
      background: #475569;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
      white-space: pre-wrap;
    }

    /* DASHBOARD */
    #dashboard {
      min-height: 100vh;
    }

    .topbar {
      background: #0f172a;
      color: white;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbarTitle {
      font-size: 22px;
      font-weight: bold;
    }

    .logoutBtn {
      border: 0;
      background: #dc2626;
      color: white;
      padding: 9px 15px;
      border-radius: 8px;
      font-weight: bold;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .cardTitle {
      color: #64748b;
      font-size: 14px;
    }

    .cardValue {
      font-size: 26px;
      font-weight: bold;
      margin-top: 8px;
    }

    .section {
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .section h2 {
      margin-top: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .tableWrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 750px;
      border-collapse: collapse;
    }

    th, td {
      border-bottom: 1px solid #e2e8f0;
      padding: 11px;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #f8fafc;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .badgeActive {
      background: #dcfce7;
      color: #166534;
    }

    .badgeBlocked {
      background: #fee2e2;
      color: #991b1b;
    }

    .smallBtn {
      border: 0;
      border-radius: 6px;
      padding: 6px 9px;
      color: white;
      font-size: 12px;
      margin: 2px;
    }

    @media (max-width: 800px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }
      .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 480px) {
      .cards {
        grid-template-columns: 1fr;
      }
      .container {
        padding: 12px;
      }
      .section {
        padding: 15px;
      }
      .topbarTitle {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

<!-- ================= LOGIN PAGE ================= -->
<div id="loginPage">
  <div class="loginBox">
    <div class="logo">DhanFlow</div>
    <div class="loginSubtitle">Secure Wallet Management</div>

    <label for="email">Email</label>
    <input id="email" type="email" placeholder="Enter admin email" autocomplete="username">

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Enter password" autocomplete="current-password">

    <button id="loginButton" class="btn full" type="button">Login</button>

    <div id="loginMessage" class="message"></div>
  </div>
</div>

<!-- ================= ADMIN DASHBOARD ================= -->
<div id="dashboard" class="hidden">
  <div class="topbar">
    <div class="topbarTitle">DhanFlow Admin Panel</div>
    <button id="logoutButton" class="logoutBtn" type="button">Logout</button>
  </div>

  <div class="container">
    <!-- SUMMARY -->
    <div class="cards">
      <div class="card">
        <div class="cardTitle">Total Customers</div>
        <div id="totalCustomers" class="cardValue">0</div>
      </div>
      <div class="card">
        <div class="cardTitle">Total Balance</div>
        <div id="totalBalance" class="cardValue">₹0.00</div>
      </div>
      <div class="card">
        <div class="cardTitle">Pending Transfers</div>
        <div id="pendingTransfers" class="cardValue">0</div>
      </div>
      <div class="card">
        <div class="cardTitle">Pending Withdrawals</div>
        <div id="pendingWithdrawals" class="cardValue">0</div>
      </div>
    </div>

    <!-- CREATE CUSTOMER -->
    <div class="section">
      <h2>Create Customer</h2>
      <div class="grid">
        <div>
          <label>User ID</label>
          <input id="newUserId" placeholder="USER001">
        </div>
        <div>
          <label>Username</label>
          <input id="newUsername" placeholder="username">
        </div>
        <div>
          <label>Email</label>
          <input id="newEmail" type="email" placeholder="customer@email.com">
        </div>
        <div>
          <label>Password</label>
          <input id="newPassword" type="password" placeholder="Minimum 6 characters">
        </div>
        <div>
          <label>Initial Balance</label>
          <input id="newBalance" type="number" min="0" step="0.01" value="0">
        </div>
      </div>

      <button id="createCustomerButton" class="btn success full" type="button">Create Customer</button>
      <div id="customerMessage" class="message"></div>
    </div>

    <!-- CUSTOMERS TABLE -->
    <div class="section">
      <h2>Customers</h2>
      <div class="tableWrap">
        <table>
          <thead>
            <tr>
              <th>User ID</th>
              <th>Username</th>
              <th>Role</th>
              <th>Balance</th>
              <th>Status</th>
              <th>Created</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="customerTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================
   SUPABASE CONFIG
============================================ */
const SUPABASE_URL = "https://oxwjnravklpcdhfxibya.supabase.co";
const SUPABASE_KEY = "sb_publishable_e8SsrFVAkRKIoLVtgOXNGA_KHwMstRC";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ============================================
   HELPER MESSAGES
============================================ */
function showMessage(elementId, message, success = false) {
  const element = document.getElementById(elementId);
  if (!element) return;

  element.style.display = "block";
  element.textContent = message;

  if (success) {
    element.style.background = "#dcfce7";
    element.style.color = "#166534";
  } else {
    element.style.background = "#fee2e2";
    element.style.color = "#991b1b";
  }
}

/* ============================================
   LOGIN FUNCTION
============================================ */
async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email) {
    showMessage("loginMessage", "Please enter your email.");
    return;
  }

  if (!password) {
    showMessage("loginMessage", "Please enter your password.");
    return;
  }

  showMessage("loginMessage", "Logging in...", true);

  try {
    const result = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (result.error) {
      console.error("SUPABASE LOGIN ERROR:", result.error);
      showMessage("loginMessage", "Login failed:\n" + result.error.message);
      return;
    }

    if (!result.data.user) {
      showMessage("loginMessage", "Login failed: user not found.");
      return;
    }

    const profileResult = await supabaseClient
      .from("profiles")
      .select("id,user_id,username,role,balance,status")
      .eq("id", result.data.user.id)
      .single();

    if (profileResult.error) {
      console.error("PROFILE ERROR:", profileResult.error);
      await supabaseClient.auth.signOut();
      showMessage("loginMessage", "Profile error:\n" + profileResult.error.message);
      return;
    }

    const profile = profileResult.data;

    if (profile.role !== "admin") {
      await supabaseClient.auth.signOut();
      showMessage("loginMessage", "This account is not an admin account.");
      return;
    }

    if (profile.status !== "active") {
      await supabaseClient.auth.signOut();
      showMessage("loginMessage", "This admin account is blocked.");
      return;
    }

    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");

    await loadDashboard();
  } catch (error) {
    console.error("LOGIN ERROR:", error);
    showMessage("loginMessage", "Unexpected error:\n" + (error.message || "Unknown error"));
  }
}

/* ============================================
   LOGOUT FUNCTION
============================================ */
async function logout() {
  await supabaseClient.auth.signOut();
  document.getElementById("dashboard").classList.add("hidden");
  document.getElementById("loginPage").classList.remove("hidden");
  document.getElementById("password").value = "";
  showMessage("loginMessage", "Logged out successfully.", true);
}

/* ============================================
   LOAD DASHBOARD DATA
============================================ */
async function loadDashboard() {
  await loadCustomers();
}

/* ============================================
   LOAD CUSTOMERS
============================================ */
async function loadCustomers() {
  const result = await supabaseClient
    .from("profiles")
    .select("*")
    .order("created_at", { ascending: false });

  if (result.error) {
    console.error("CUSTOMER LOAD ERROR:", result.error);
    return;
  }

  const users = result.data || [];
  const tbody = document.getElementById("customerTableBody");
  tbody.innerHTML = "";

  let customerCount = 0;
  let totalBalance = 0;

  users.forEach(function(user) {
    if (user.role === "customer") {
      customerCount++;
      totalBalance += Number(user.balance || 0);
    }

    const row = document.createElement("tr");
    const statusClass = user.status === "active" ? "badgeActive" : "badgeBlocked";

    row.innerHTML = `
      <td>${user.user_id || "-"}</td>
      <td>${user.username || "-"}</td>
      <td>${user.role || "-"}</td>
      <td>₹${Number(user.balance || 0).toFixed(2)}</td>
      <td><span class="badge ${statusClass}">${user.status || "-"}</span></td>
      <td>${user.created_at ? new Date(user.created_at).toLocaleDateString() : "-"}</td>
      <td>-</td>
    `;
    tbody.appendChild(row);
  });

  document.getElementById("totalCustomers").textContent = customerCount;
  document.getElementById("totalBalance").textContent = "₹" + totalBalance.toFixed(2);
}

/* ============================================
   EVENT LISTENERS (বাটনগুলোর কানেকশন)
============================================ */
document.getElementById("loginButton").addEventListener("click", login);

const logoutBtn = document.getElementById("logoutButton");
if (logoutBtn) {
  logoutBtn.addEventListener("click", logout);
}
</script>

</body>
</html>
