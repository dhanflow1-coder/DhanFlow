<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DhanFlow User</title>

<meta name="theme-color" content="#111827">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f4f6;
  color:#111827;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  background:#f8fafc;
}

.header{
  background:#111827;
  color:white;
  padding:15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:20;
}

.header-left h2{
  margin:0;
  font-size:20px;
}

.header-left small{
  opacity:.7;
}

.header-right{
  display:flex;
  gap:7px;
}

.icon-btn{
  border:0;
  background:#1f2937;
  color:white;
  width:40px;
  height:40px;
  border-radius:10px;
  font-size:18px;
}

.badge{
  display:inline-block;
  font-size:11px;
  background:#2563eb;
  padding:4px 8px;
  border-radius:20px;
  margin-top:5px;
}

.page{
  padding:15px;
  padding-bottom:90px;
}

.card{
  background:white;
  border-radius:16px;
  padding:16px;
  margin-bottom:15px;
  box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.balance-card{
  background:#111827;
  color:white;
  padding:22px;
  border-radius:18px;
  margin-bottom:15px;
}

.balance-label{
  font-size:13px;
  opacity:.7;
}

.balance{
  font-size:32px;
  font-weight:bold;
  margin-top:8px;
}

.section{
  margin-bottom:15px;
}

.section-title{
  font-size:16px;
  font-weight:bold;
  margin-bottom:10px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.action{
  border:0;
  background:white;
  padding:16px 10px;
  border-radius:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.05);
  text-align:left;
  font-weight:bold;
}

.action span{
  display:block;
  font-size:12px;
  color:#6b7280;
  margin-top:5px;
  font-weight:normal;
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid #e5e7eb;
}

.row:last-child{
  border-bottom:0;
}

.small{
  font-size:12px;
  color:#6b7280;
  margin-top:4px;
}

.empty{
  text-align:center;
  padding:25px 10px;
  color:#6b7280;
}

.status{
  display:inline-block;
  padding:5px 8px;
  border-radius:20px;
  font-size:11px;
  white-space:nowrap;
}

.status.approved{
  background:#dcfce7;
  color:#166534;
}

.status.pending{
  background:#fef3c7;
  color:#92400e;
}

.status.rejected{
  background:#fee2e2;
  color:#991b1b;
}

.status.active{
  background:#dcfce7;
  color:#166534;
}

.status.inactive{
  background:#fee2e2;
  color:#991b1b;
}

.primary{
  width:100%;
  border:0;
  background:#2563eb;
  color:white;
  padding:13px;
  border-radius:10px;
  font-weight:bold;
}

.secondary{
  width:100%;
  border:0;
  background:#e5e7eb;
  color:#111827;
  padding:13px;
  border-radius:10px;
  font-weight:bold;
}

.danger{
  width:100%;
  border:0;
  background:#dc2626;
  color:white;
  padding:13px;
  border-radius:10px;
  font-weight:bold;
}

input{
  width:100%;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:10px;
  outline:none;
  margin-top:6px;
  margin-bottom:12px;
  background:white;
}

input:focus{
  border-color:#2563eb;
}

label{
  font-size:13px;
  font-weight:bold;
}

.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#111827;
}

.login-box{
  width:100%;
  max-width:400px;
  background:white;
  border-radius:20px;
  padding:25px;
}

.login-box h1{
  margin-top:0;
}

.login-message{
  padding:10px;
  border-radius:8px;
  margin-bottom:12px;
  font-size:13px;
  display:none;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:520px;
  background:white;
  border-top:1px solid #e5e7eb;
  display:flex;
  z-index:30;
}

.nav-btn{
  flex:1;
  border:0;
  background:white;
  padding:12px 5px;
  font-size:12px;
  color:#6b7280;
}

.nav-btn.active{
  color:#2563eb;
  font-weight:bold;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:100;
}

.modal-box{
  width:100%;
  max-width:520px;
  max-height:90vh;
  overflow:auto;
  background:#f8fafc;
  border-radius:20px 20px 0 0;
  padding:18px;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.modal-header h3{
  margin:0;
}

.close-btn{
  border:0;
  background:#e5e7eb;
  width:35px;
  height:35px;
  border-radius:50%;
}

.message-item{
  width:100%;
  border:0;
  background:white;
  text-align:left;
  padding:14px;
  border-radius:14px;
  margin-bottom:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}

.message-item.unread{
  border-left:4px solid #2563eb;
}

.message-preview{
  color:#6b7280;
  font-size:13px;
  margin-top:6px;
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}

.notice{
  padding:10px;
  background:#eff6ff;
  color:#1e40af;
  border-radius:10px;
  font-size:12px;
  margin-bottom:12px;
}
</style>
</head>

<body>

<div id="loginScreen" class="login-screen">

  <div class="login-box">

    <h1>💳 DhanFlow</h1>

    <p class="small">
      User Login
    </p>

    <div id="loginMessage" class="login-message"></div>

    <label>Email</label>
    <input
      id="loginEmail"
      type="email"
      placeholder="Enter email"
    >

    <label>Password</label>

    <div style="position:relative">

      <input
        id="loginPassword"
        type="password"
        placeholder="Enter password"
      >

      <button
        onclick="togglePassword('loginPassword')"
        style="
          position:absolute;
          right:8px;
          top:9px;
          border:0;
          background:transparent;
        "
      >
        👁️
      </button>

    </div>

    <button
      class="primary"
      onclick="login()"
    >
      Login
    </button>

    <button
      class="secondary"
      style="margin-top:10px"
      onclick="forgotPassword()"
    >
      Forgot Password?
    </button>

  </div>

</div>


<div id="app" class="app" style="display:none">

  <header class="header">

    <div class="header-left">

      <h2>DhanFlow</h2>

      <small id="headerUsername">
        User
      </small>

      <div class="badge">
        USER
      </div>

    </div>

    <div class="header-right">

      <button
        class="icon-btn"
        onclick="openInbox()"
        title="Inbox"
      >
        📥
      </button>

      <button
        class="icon-btn"
        onclick="refreshData()"
        title="Refresh"
      >
        🔄
      </button>

    </div>

  </header>


  <main class="page">

    <!-- HOME -->

    <section id="homePage">

      <div class="balance-card">

        <div class="balance-label">
          Wallet Balance
        </div>

        <div
          id="balance"
          class="balance"
        >
          ₹0
        </div>

        <div
          id="userStatus"
          style="margin-top:8px"
        ></div>

      </div>


      <div class="section">

        <div class="section-title">
          Quick Actions
        </div>

        <div class="actions">

          <button
            class="action"
            onclick="openTransfer()"
          >
            💸 Send Money
            <span>
              Internal transfer request
            </span>
          </button>

          <button
            class="action"
            onclick="openWithdrawal()"
          >
            🏦 Withdraw
            <span>
              Internal withdrawal request
            </span>
          </button>

          <button
            class="action"
            onclick="openInbox()"
          >
            📥 Inbox
            <span>
              Messages from Admin
            </span>
          </button>

          <button
            class="action"
            onclick="showPage('history')"
          >
            📜 History
            <span>
              Transactions & requests
            </span>
          </button>

        </div>

      </div>


      <div class="section">

        <div class="section-title">
          Recent Transactions
        </div>

        <div
          id="recentTransactions"
          class="card"
        >
          <div class="empty">
            Loading...
          </div>
        </div>

      </div>

    </section>


    <!-- HISTORY -->

    <section
      id="historyPage"
      style="display:none"
    >

      <div class="section-title">
        Transaction History
      </div>

      <div
        id="transactionHistory"
        class="card"
      >
        <div class="empty">
          Loading...
        </div>
      </div>


      <div class="section-title">
        Withdrawal History
      </div>

      <div
        id="withdrawalHistory"
        class="card"
      >
        <div class="empty">
          Loading...
        </div>
      </div>

    </section>


    <!-- PROFILE -->

    <section
      id="profilePage"
      style="display:none"
    >

      <div class="card">

        <div class="section-title">
          👤 Profile
        </div>

        <div class="row">
          <span>Username</span>
          <b id="profileUsername">-</b>
        </div>

        <div class="row">
          <span>User ID</span>
          <b id="profileUserId">-</b>
        </div>

        <div class="row">
          <span>Email</span>
          <b
            id="profileEmail"
            style="font-size:12px"
          >
            -
          </b>
        </div>

        <div class="row">
          <span>Status</span>
          <span id="profileStatus"></span>
        </div>

        <div class="row">
          <span>Balance</span>
          <b id="profileBalance">₹0</b>
        </div>

      </div>


      <div class="card">

        <div class="section-title">
          🔐 Change Password
        </div>

        <label>
          New Password
        </label>

        <input
          id="newPassword"
          type="password"
          placeholder="New password"
        >

        <button
          class="primary"
          onclick="changePassword()"
        >
          Change Password
        </button>

      </div>


      <div class="card">

        <button
          class="danger"
          onclick="logout()"
        >
          Logout
        </button>

      </div>

    </section>

  </main>


  <nav class="bottom-nav">

    <button
      id="navHome"
      class="nav-btn active"
      onclick="showPage('home')"
    >
      🏠<br>
      Home
    </button>

    <button
      id="navHistory"
      class="nav-btn"
      onclick="showPage('history')"
    >
      📜<br>
      History
    </button>

    <button
      id="navProfile"
      class="nav-btn"
      onclick="showPage('profile')"
    >
      👤<br>
      Profile
    </button>

  </nav>

</div>


<!-- MODAL -->

<div
  id="modal"
  class="modal"
  onclick="closeModalOutside(event)"
>

  <div
    class="modal-box"
    onclick="event.stopPropagation()"
  >

    <div class="modal-header">

      <h3 id="modalTitle">
        Modal
      </h3>

      <button
        class="close-btn"
        onclick="closeModal()"
      >
        ✕
      </button>

    </div>

    <div id="modalContent"></div>

  </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://oxwjnravklpcdhfxibya.supabase.co";

const SUPABASE_KEY =
"sb_publishable_e8SsrFVAkRKIoLVtgOXNGA_KHwMstRC";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   GLOBAL VARIABLES
========================= */

let currentUser = null;
let currentProfile = null;
let inboxMessages = [];


/* =========================
   HELPERS
========================= */

function money(amount){

  return new Intl.NumberFormat(
    "en-IN",
    {
      style:"currency",
      currency:"INR",
      maximumFractionDigits:2
    }
  ).format(Number(amount || 0));

}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function dateTime(value){

  if(!value) return "-";

  return new Date(value).toLocaleString(
    "en-IN",
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );

}


function statusHTML(status){

  const s =
    String(status || "pending").toLowerCase();

  if(
    s === "approved" ||
    s === "completed" ||
    s === "success"
  ){

    return `
      <span class="status approved">
        ${escapeHTML(status)}
      </span>
    `;

  }

  if(
    s === "rejected" ||
    s === "cancelled" ||
    s === "failed"
  ){

    return `
      <span class="status rejected">
        ${escapeHTML(status)}
      </span>
    `;

  }

  return `
    <span class="status pending">
      ${escapeHTML(status || "pending")}
    </span>
  `;

}


function togglePassword(id){

  const input =
    document.getElementById(id);

  if(!input) return;

  input.type =
    input.type === "password"
      ? "text"
      : "password";

}


function showLoginMessage(
  message,
  success=false
){

  const box =
    document.getElementById("loginMessage");

  box.style.display = "block";

  box.style.background =
    success ? "#dcfce7" : "#fee2e2";

  box.style.color =
    success ? "#166534" : "#991b1b";

  box.textContent = message;

}


async function copyText(text){

  try{

    await navigator.clipboard.writeText(text);

    alert("User ID copied.");

  }catch{

    alert("Could not copy User ID.");

  }

}


/* =========================
   LOGIN
========================= */

async function login(){

  const email =
    document.getElementById("loginEmail")
      .value.trim();

  const password =
    document.getElementById("loginPassword")
      .value;

  if(!email || !password){

    showLoginMessage(
      "Please enter email and password."
    );

    return;
  }


  const {
    data,
    error
  } =
  await supabaseClient.auth.signInWithPassword({
    email,
    password
  });


  if(error){

    showLoginMessage(
      error.message
    );

    return;
  }


  if(!data.user){

    showLoginMessage(
      "Login failed."
    );

    return;
  }


  await loadUser();

}


/* =========================
   FORGOT PASSWORD
========================= */

async function forgotPassword(){

  const email =
    document.getElementById("loginEmail")
      .value.trim();

  if(!email){

    showLoginMessage(
      "First enter your email."
    );

    return;
  }


  const {
    error
  } =
  await supabaseClient.auth
    .resetPasswordForEmail(
      email,
      {
        redirectTo:location.href
      }
    );


  if(error){

    showLoginMessage(
      error.message
    );

    return;
  }


  showLoginMessage(
    "Password reset email sent.",
    true
  );

}


/* =========================
   LOAD USER
========================= */

async function loadUser(){

  const {
    data:{
      user
    }
  } =
  await supabaseClient.auth.getUser();


  if(!user){

    showLogin();

    return;
  }


  const {
    data,
    error
  } =
  await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id",user.id)
    .single();


  if(error){

    alert(
      "Profile load failed: " +
      error.message
    );

    await supabaseClient.auth.signOut();

    showLogin();

    return;
  }


  currentUser = user;
  currentProfile = data;


  if(data.role !== "customer"){

    alert(
      "This account is not a customer account. Please use the Admin App for admin accounts."
    );

    await supabaseClient.auth.signOut();

    showLogin();

    return;
  }


  if(
    String(data.status || "")
      .toLowerCase() !== "active"
  ){

    alert(
      "Your account is currently inactive."
    );

    await supabaseClient.auth.signOut();

    showLogin();

    return;
  }


  document.getElementById(
    "loginScreen"
  ).style.display = "none";


  document.getElementById(
    "app"
  ).style.display = "block";


  updateProfileUI();

  await refreshData();

}


/* =========================
   SHOW LOGIN
========================= */

function showLogin(){

  document.getElementById(
    "loginScreen"
  ).style.display = "flex";

  document.getElementById(
    "app"
  ).style.display = "none";

}


/* =========================
   PROFILE UI
========================= */

function updateProfileUI(){

  if(!currentProfile) return;


  const username =
    currentProfile.username || "User";


  document.getElementById(
    "headerUsername"
  ).textContent = username;


  document.getElementById(
    "balance"
  ).textContent =
    money(currentProfile.balance);


  document.getElementById(
    "profileUsername"
  ).textContent =
    username;


  document.getElementById(
    "profileUserId"
  ).textContent =
    currentProfile.user_id ||
    currentProfile.id ||
    "-";


  document.getElementById(
    "profileEmail"
  ).textContent =
    currentUser?.email || "-";


  document.getElementById(
    "profileBalance"
  ).textContent =
    money(currentProfile.balance);


  document.getElementById(
    "profileStatus"
  ).innerHTML =
    `<span class="status active">
      ${escapeHTML(currentProfile.status || "active")}
    </span>`;


  document.getElementById(
    "userStatus"
  ).innerHTML =
    `<span class="status active">
      Account Active
    </span>`;

}


/* =========================
   REFRESH
========================= */

async function refreshData(){

  if(!currentUser || !currentProfile)
    return;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id",currentUser.id)
    .single();


  if(!error && data){

    currentProfile = data;

    updateProfileUI();

  }


  await loadTransactions();

}


/* =========================
   TRANSACTIONS
========================= */

async function loadTransactions(){

  if(!currentProfile) return;


  const {
    data:transactions,
    error:txError
  } =
  await supabaseClient
    .from("transactions")
    .select("*")
    .or(
      `sender_id.eq.${currentProfile.id},receiver_id.eq.${currentProfile.id}`
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  const {
    data:withdrawals,
    error:wdError
  } =
  await supabaseClient
    .from("withdrawals")
    .select("*")
    .eq(
      "user_id",
      currentProfile.id
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  renderRecentTransactions(
    transactions || []
  );


  renderTransactionHistory(
    transactions || [],
    txError
  );


  renderWithdrawalHistory(
    withdrawals || [],
    wdError
  );

}


/* =========================
   RECENT TRANSACTIONS
========================= */

function renderRecentTransactions(
  transactions
){

  const box =
    document.getElementById(
      "recentTransactions"
    );


  if(!transactions.length){

    box.innerHTML =
      `<div class="empty">
        No transactions yet.
      </div>`;

    return;
  }


  box.innerHTML =
    transactions
      .slice(0,5)
      .map(tx => {

        const isSender =
          String(tx.sender_id) ===
          String(currentProfile.id);


        return `
          <div class="row">

            <div>

              <b>
                ${
                  isSender
                    ? "Sent"
                    : "Received"
                }
              </b>

              <div class="small">
                ${escapeHTML(
                  tx.description || ""
                )}
              </div>

              <div class="small">
                ${escapeHTML(
                  dateTime(tx.created_at)
                )}
              </div>

            </div>

            <div style="text-align:right">

              <b>
                ${
                  isSender
                    ? "-"
                    : "+"
                }${money(tx.amount)}
              </b>

              <div>
                ${statusHTML(tx.status)}
              </div>

            </div>

          </div>
        `;

      })
      .join("");

}


/* =========================
   TRANSACTION HISTORY
========================= */

function renderTransactionHistory(
  transactions,
  error
){

  const box =
    document.getElementById(
      "transactionHistory"
    );


  if(error){

    box.innerHTML =
      `<div class="empty">
        ${escapeHTML(error.message)}
      </div>`;

    return;
  }


  if(!transactions.length){

    box.innerHTML =
      `<div class="empty">
        No transaction history.
      </div>`;

    return;
  }


  box.innerHTML =
    transactions.map(tx => {

      const isSender =
        String(tx.sender_id) ===
        String(currentProfile.id);


      return `
        <div class="row">

          <div>

            <b>
              ${
                isSender
                  ? "Sent Money"
                  : "Received Money"
              }
            </b>

            <div class="small">
              ${escapeHTML(
                tx.description || ""
              )}
            </div>

            <div class="small">
              ${escapeHTML(
                dateTime(tx.created_at)
              )}
            </div>

          </div>

          <div style="text-align:right">

            <b>
              ${
                isSender
                  ? "-"
                  : "+"
              }${money(tx.amount)}
            </b>

            <div>
              ${statusHTML(tx.status)}
            </div>

          </div>

        </div>
      `;

    }).join("");

}

/* =========================
   TRANSFER
========================= */

function openTransfer(){

  openModal(
    "💸 Send Money",
    `
      <div class="notice">
        This is an internal wallet transfer request.
      </div>

      <label>
        Receiver User ID
      </label>

      <input
        id="receiverUserId"
        placeholder="Enter receiver User ID"
      >

      <label>
        Amount
      </label>

      <input
        id="transferAmount"
        type="number"
        min="1"
        placeholder="Enter amount"
      >

      <button
        class="primary"
        onclick="sendTransfer()"
      >
        Send Request
      </button>
    `
  );

}


async function sendTransfer(){

  const receiver =
    document.getElementById(
      "receiverUserId"
    ).value.trim();


  const amount =
    Number(
      document.getElementById(
        "transferAmount"
      ).value
    );


  if(!receiver){

    alert("Enter receiver User ID.");

    return;
  }


  if(!amount || amount <= 0){

    alert("Enter a valid amount.");

    return;
  }


  if(
    amount >
    Number(currentProfile.balance || 0)
  ){

    alert("Insufficient wallet balance.");

    return;
  }


  const {
    error
  } =
  await supabaseClient.rpc(
    "create_transfer_request",
    {
      p_receiver_user_id:receiver,
      p_amount:amount
    }
  );


  if(error){

    alert(error.message);

    return;
  }


  alert(
    "Transfer request created successfully."
  );


  closeModal();

  await refreshData();

}

function openWithdrawal(){

        Bank Name

async function sendWithdrawal(){

  const bankName =
    document.getElementById(
      "bankName"
    ).value.trim();


  const accountHolder =
    document.getElementById(
      "accountHolder"
    ).value.trim();


  const accountNumber =
    document.getElementById(
      "accountNumber"
    ).value.trim();


  const ifsc =
    document.getElementById(
      "ifsc"
    ).value.trim();


  const amount =
    Number(
      document.getElementById(
        "withdrawAmount"
      ).value
    );


  if(
    !bankName ||
    !accountHolder ||
    !accountNumber ||
    !ifsc
  ){

    alert(
      "Please fill all fields."
    );

    return;
  }


  if(!amount || amount <= 0){

    alert(
      "Enter a valid amount."
    );

    return;
  }


  if(
    amount >
    Number(currentProfile.balance || 0)
  ){

    alert(
      "Insufficient wallet balance."
    );

    return;
  }


  const {
    error
  } =
  await supabaseClient.rpc(
    "create_withdrawal_request",
    {
      p_bank_name:bankName,
      p_account_holder:accountHolder,
      p_account_number:accountNumber,
      p_ifsc:ifsc,
      p_amount:amount

  );


  if(error){

    alert(error.message);

  }


  alert(
    "Withdrawal request submitted."

/* =========================
   INBOX
========================= */

async function openInbox(){

  openModal(
    "📥 Inbox",
    `
      <div id="inboxContent">
        <div class="empty">
          Loading messages...
        </div>
      </div>
    `
  );


  await loadInbox();

}


async function loadInbox(){

  const box =
    document.getElementById(
      "inboxContent"
    );


  if(!box || !currentUser)
    return;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("message")
    .select("*")
    .eq(
      "receiver_id",
      currentUser.id
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    box.innerHTML =
      `
        <div class="empty">
          Inbox load failed:<br>
          ${escapeHTML(error.message)}
        </div>
      `;

    return;
  }


  inboxMessages =
    data || [];


  if(!inboxMessages.length){

    box.innerHTML =
      `
        <div class="empty">
          📭 No messages yet.
        </div>
      `;

    return;
  }


  box.innerHTML =
    inboxMessages.map(m => {

      const unread =
        !m.is_read;


      return `
        <button
          class="message-item ${
            unread ? "unread" : ""
          }"
          onclick="readInboxMessage('${m.id}')"
        >

          <div
            style="
              display:flex;
              justify-content:space-between;
              gap:10px;
            "
          >

            <b>
              ${escapeHTML(
                m.subject ||
                "Message from Admin"
              )}
            </b>

            ${
              unread
              ?
              `<span class="status pending">
                New
              </span>`
              :
              `<span class="status approved">
                Read
              </span>`
            }

          </div>


          <div class="message-preview">
            ${escapeHTML(
              m.message || ""
            )}
          </div>


          <div class="small">
            ${escapeHTML(
              dateTime(m.created_at)
            )}
          </div>

        </button>
      `;

    }).join("");

}


/* =========================
   READ MESSAGE
========================= */

async function readInboxMessage(id){

  const msg =
    inboxMessages.find(
      x =>
        String(x.id) ===
        String(id)
    );


  if(!msg) return;


  if(!msg.is_read){

    const {
      error
    } =
    await supabaseClient
      .from("message")
      .update({
        is_read:true,
        read_at:
          new Date().toISOString()
      })
      .eq(
        "id",
        msg.id
      )
      .eq(
        "receiver_id",
        currentUser.id
      );


    if(error){

      console.error(error);

      alert(
        "Could not mark message as read."
      );

      return;
    }


    msg.is_read = true;

    msg.read_at =
      new Date().toISOString();

  }


  openModal(
    msg.subject ||
    "Message from Admin",

    `
      <div class="card">

        <div class="small">
          From: Admin
        </div>

        <div class="small">
          ${escapeHTML(
            dateTime(msg.created_at)
          )}
        </div>

        <div
          style="
            margin-top:15px;
            font-size:14px;
            line-height:1.7;
            white-space:pre-wrap;
          "
        >
          ${escapeHTML(
            msg.message || ""
          )}
        </div>

      </div>

      <button
        class="secondary"
        onclick="openInbox()"
      >
        ← Back to Inbox
      </button>
    `
  );

}


/* =========================
   CHANGE PASSWORD
========================= */

async function changePassword(){

  const password =
    document.getElementById(
      "newPassword"
    ).value;


  if(!password){

    alert(
      "Enter a new password."
    );

    return;
  }


  if(password.length < 6){

    alert(
      "Password must be at least 6 characters."
    );

    return;
  }


  const {
    error
  } =
  await supabaseClient.auth
    .updateUser({
      password
    });


  if(error){

    alert(error.message);

    return;
  }


  document.getElementById(
    "newPassword"
  ).value = "";


  alert(
    "Password changed successfully."
  );

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await supabaseClient.auth.signOut();

  currentUser = null;
  currentProfile = null;

  showLogin();

}


/* =========================
   PAGES
========================= */

function showPage(page){

  document.getElementById(
    "homePage"
  ).style.display =
    page === "home"
      ? "block"
      : "none";


  document.getElementById(
    "historyPage"
  ).style.display =
    page === "history"
      ? "block"
      : "none";


  document.getElementById(
    "profilePage"
  ).style.display =
    page === "profile"
      ? "block"
      : "none";


  document
    .querySelectorAll(".nav-btn")
    .forEach(btn =>
      btn.classList.remove("active")
    );


  if(page === "home"){

    document.getElementById(
      "navHome"
    ).classList.add("active");

  }


  if(page === "history"){

    document.getElementById(
      "navHistory"
    ).classList.add("active");

  }


  if(page === "profile"){

    document.getElementById(
      "navProfile"
    ).classList.add("active");

  }

}


/* =========================
   MODAL
========================= */

function openModal(
  title,
  content
){

  document.getElementById(
    "modalTitle"
  ).textContent = title;


  document.getElementById(
    "modalContent"
  ).innerHTML = content;


  document.getElementById(
    "modal"
  ).style.display = "flex";

}


function closeModal(){

  document.getElementById(
    "modal"
  ).style.display = "none";

}


function closeModalOutside(event){

  if(
    event.target.id === "modal"
  ){

    closeModal();

  }

}


/* =========================
   AUTH STATE
========================= */

supabaseClient.auth.onAuthStateChange(
  async (event, session) => {

    if(
      event === "PASSWORD_RECOVERY"
    ){

      return;
    }


    if(
      session &&
      !currentUser
    ){

      await loadUser();

    }

  }
);


/* =========================
   START APP
========================= */

(async function(){

  const {
    data:{
      session
    }
  } =
  await supabaseClient.auth.getSession();


  if(session){

    await loadUser();

  }else{

    showLogin();

  }

})();

</script>
