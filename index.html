<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DhanFlow Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #111827;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    input,
    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 12px;
      border-radius: 8px;
      font-size: 15px;
    }

    input {
      border: 1px solid #d1d5db;
    }

    button {
      border: 0;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .logout {
      background: #dc2626;
    }

    .success {
      background: #dcfce7;
      color: #166534;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .stat {
      background: #f8fafc;
      border-radius: 10px;
      padding: 18px;
      border: 1px solid #e5e7eb;
    }

    .stat strong {
      display: block;
      font-size: 25px;
      margin-top: 8px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }

    th {
      background: #f8fafc;
    }

    .hidden {
      display: none !important;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .topbar button {
      width: auto;
      margin: 0;
      padding: 10px 18px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 12px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .topbar button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN PAGE -->
  <div id="loginPage">
    <div class="container">

      <div class="card" style="max-width:450px;margin:60px auto;">

        <h1>DhanFlow</h1>
        <p>Admin Login</p>

        <div id="loginError" class="error"></div>

        <label>Email</label>
        <input
          type="email"
          id="loginEmail"
          placeholder="Admin email"
        >

        <label>Password</label>
        <input
          type="password"
          id="loginPassword"
          placeholder="Password"
        >

        <button onclick="login()">
          Login
        </button>

      </div>

    </div>
  </div>


  <!-- DASHBOARD -->
  <div id="dashboardPage" class="hidden">

    <div class="container">

      <div class="topbar">

        <div>
          <h1>DhanFlow Admin Dashboard</h1>
          <div id="adminInfo"></div>
        </div>

        <button
          class="logout"
          onclick="logout()"
        >
          Logout
        </button>

      </div>


      <!-- STATS -->
      <div class="card">

        <h2>Overview</h2>

        <div class="stats">

          <div class="stat">
            Total Customers
            <strong id="totalCustomers">0</strong>
          </div>

          <div class="stat">
            Total Balance
            <strong id="totalBalance">₹0.00</strong>
          </div>

          <div class="stat">
            Pending Transfers
            <strong id="pendingTransfers">0</strong>
          </div>

          <div class="stat">
            Pending Withdrawals
            <strong id="pendingWithdrawals">0</strong>
          </div>

        </div>

      </div>


      <!-- ADD CUSTOMER -->
      <div class="card">

        <h2>Add Customer</h2>

        <div id="customerSuccess" class="success"></div>
        <div id="customerError" class="error"></div>

        <label>User ID</label>
        <input
          type="text"
          id="customerUserId"
          placeholder="Example: USER001"
        >

        <label>Username</label>
        <input
          type="text"
          id="customerUsername"
          placeholder="Example: rahim"
        >

        <label>Email</label>
        <input
          type="email"
          id="customerEmail"
          placeholder="customer@email.com"
        >

        <label>Password</label>
        <input
          type="password"
          id="customerPassword"
          placeholder="Minimum 6 characters"
        >

        <label>Initial Balance</label>
        <input
          type="number"
          id="customerBalance"
          placeholder="0"
          min="0"
          step="0.01"
        >

        <button onclick="createCustomer()">
          Create Customer
        </button>

      </div>


      <!-- CUSTOMER LIST -->
      <div class="card">

        <h2>Customers</h2>

        <div id="customerListError" class="error"></div>

        <div class="table-wrapper">

          <table>

            <thead>
              <tr>
                <th>User ID</th>
                <th>Username</th>
                <th>Role</th>
                <th>Balance</th>
                <th>Status</th>
                <th>Created</th>
              </tr>
            </thead>

            <tbody id="customerTableBody">

              <tr>
                <td colspan="6">
                  Loading...
                </td>
              </tr>

            </tbody>

          </table>

        </div>

      </div>


      <!-- FUTURE MODULES -->
      <div class="card">

        <h2>Management</h2>

        <button onclick="comingSoon('Transactions')">
          Transactions
        </button>

        <button onclick="comingSoon('Transfers')">
          User Transfers
        </button>

        <button onclick="comingSoon('Withdrawals')">
          Bank Withdrawals
        </button>

        <button onclick="comingSoon('Admin Actions')">
          Admin Action Log
        </button>

      </div>

    </div>

  </div>


<script>

  /* ================================
     SUPABASE CONFIGURATION
  ================================= */

  const SUPABASE_URL =
    "https://oxwjnravklpcdhfxibya.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_e8SsrFVAkRKIoLVtgOXNGA_KHwMstRC";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ================================
     HELPER
  ================================= */

  function showError(id, message) {

    const box = document.getElementById(id);

    if (!box) return;

    box.textContent = message;
    box.style.display = "block";
  }


  function hideMessage(id) {

    const box = document.getElementById(id);

    if (!box) return;

    box.style.display = "none";
    box.textContent = "";
  }


  function showSuccess(id, message) {

    const box = document.getElementById(id);

    if (!box) return;

    box.textContent = message;
    box.style.display = "block";
  }


  /* ================================
     LOGIN
  ================================= */

  async function login() {

    hideMessage("loginError");

    const email =
      document.getElementById("loginEmail")
        .value
        .trim();

    const password =
      document.getElementById("loginPassword")
        .value;

    if (!email || !password) {

      showError(
        "loginError",
        "Email এবং Password দুটোই দিন।"
      );

      return;
    }


    try {

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });


      if (error) {

        throw new Error(
          error.message
        );

      }


      if (!data.user) {

        throw new Error(
          "Login session পাওয়া যায়নি।"
        );

      }


      const {
        data: profile,
        error: profileError
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "id,user_id,username,role,balance,status"
          )
          .eq("id", data.user.id)
          .single();


      if (profileError) {

        throw new Error(
          "Profile পাওয়া যাচ্ছে না: " +
          profileError.message
        );

      }


      if (profile.role !== "admin") {

        await supabaseClient.auth.signOut();

        throw new Error(
          "এই account-এর Admin access নেই।"
        );

      }


      if (profile.status !== "active") {

        await supabaseClient.auth.signOut();

        throw new Error(
          "Admin account blocked।"
        );

      }


      document
        .getElementById("loginPage")
        .classList
        .add("hidden");


      document
        .getElementById("dashboardPage")
        .classList
        .remove("hidden");


      document
        .getElementById("adminInfo")
        .textContent =
          "Logged in as: " +
          profile.username;


      await loadDashboard();

    }

    catch (error) {

      console.error(
        "LOGIN ERROR:",
        error
      );

      showError(
        "loginError",
        "Login failed: " +
        (error.message ||
          "Unknown error")
      );

    }

  }


  /* ================================
     LOGOUT
  ================================= */

  async function logout() {

    await supabaseClient.auth.signOut();

    document
      .getElementById("dashboardPage")
      .classList
      .add("hidden");

    document
      .getElementById("loginPage")
      .classList
      .remove("hidden");

  }


  /* ================================
     LOAD DASHBOARD
  ================================= */

  async function loadDashboard() {

    await loadCustomers();
    await loadStats();

  }


  /* ================================
     LOAD CUSTOMERS
  ================================= */

  async function loadCustomers() {

    hideMessage("customerListError");

    const tbody =
      document.getElementById(
        "customerTableBody"
      );

    tbody.innerHTML =
      "<tr><td colspan='6'>Loading...</td></tr>";


    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "user_id,username,role,balance,status,created_at"
          )
          .eq("role", "customer")
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {

        throw new Error(
          error.message
        );

      }


      if (!data || data.length === 0) {

        tbody.innerHTML =
          "<tr><td colspan='6'>No customers found.</td></tr>";

        return;

      }


      tbody.innerHTML =
        data.map(function(customer) {

          return `
            <tr>

              <td>
                ${escapeHtml(customer.user_id)}
              </td>

              <td>
                ${escapeHtml(customer.username)}
              </td>

              <td>
                ${escapeHtml(customer.role)}
              </td>

              <td>
                ₹${Number(
                  customer.balance || 0
                ).toFixed(2)}
              </td>

              <td>
                ${escapeHtml(customer.status)}
              </td>

              <td>
                ${new Date(
                  customer.created_at
                ).toLocaleString()}
              </td>

            </tr>
          `;

        }).join("");

    }

    catch (error) {

      console.error(
        "CUSTOMER ERROR:",
        error
      );

      tbody.innerHTML = "";

      showError(
        "customerListError",
        "Customer loading error: " +
        error.message
      );

    }

  }


  /* ================================
     LOAD STATS
  ================================= */

  async function loadStats() {

    try {

      const {
        data: customers
      } =
        await supabaseClient
          .from("profiles")
          .select("balance")
          .eq("role", "customer");


      const totalCustomers =
        customers
          ? customers.length
          : 0;


      const totalBalance =
        customers
          ? customers.reduce(
              function(total, customer) {

                return total +
                  Number(
                    customer.balance || 0
                  );

              },
              0
            )
          : 0;


      document
        .getElementById(
          "totalCustomers"
        )
        .textContent =
          totalCustomers;


      document
        .getElementById(
          "totalBalance"
        )
        .textContent =
          "₹" +
          totalBalance.toFixed(2);


      const {
        data: transfers
      } =
        await supabaseClient
          .from("transactions")
          .select("id")
          .eq(
            "type",
            "transfer"
          )
          .eq(
            "status",
            "pending"
          );


      document
        .getElementById(
          "pendingTransfers"
        )
        .textContent =
          transfers
            ? transfers.length
            : 0;


      const {
        data: withdrawals
      } =
        await supabaseClient
          .from("withdrawals")
          .select("id")
          .eq(
            "status",
            "pending"
          );


      document
        .getElementById(
          "pendingWithdrawals"
        )
        .textContent =
          withdrawals
            ? withdrawals.length
            : 0;

    }

    catch (error) {

      console.error(
        "STATS ERROR:",
        error
      );

    }

  }


  /* ================================
     CREATE CUSTOMER
  ================================= */

  async function createCustomer() {

    hideMessage(
      "customerError"
    );

    hideMessage(
      "customerSuccess"
    );


    const user_id =
      document
        .getElementById(
          "customerUserId"
        )
        .value
        .trim();


    const username =
      document
        .getElementById(
          "customerUsername"
        )
        .value
        .trim();


    const email =
      document
        .getElementById(
          "customerEmail"
        )
        .value
        .trim();


    const password =
      document
        .getElementById(
          "customerPassword"
        )
        .value;


    const initial_balance =
      Number(
        document
          .getElementById(
            "customerBalance"
          )
          .value || 0
      );


    if (
      !user_id ||
      !username ||
      !email ||
      !password
    ) {

      showError(
        "customerError",
        "User ID, Username, Email এবং Password দিন।"
      );

      return;

    }


    if (password.length < 6) {

      showError(
        "customerError",
        "Password কমপক্ষে 6 characters হতে হবে।"
      );

      return;

    }


    if (
      !Number.isFinite(
        initial_balance
      ) ||
      initial_balance < 0
    ) {

      showError(
        "customerError",
        "Initial balance 0 বা তার বেশি হতে হবে।"
      );

      return;

    }


    try {

      const {
        data: sessionData
      } =
        await supabaseClient
          .auth
          .getSession();


      const session =
        sessionData.session;


      if (!session) {

        throw new Error(
          "Admin session পাওয়া যায়নি। আবার Login করুন।"
        );

      }


      const response =
        await fetch(
          SUPABASE_URL +
          "/functions/v1/create-customer",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json",

              "Authorization":
                "Bearer " +
                session.access_token,

              "apikey":
                SUPABASE_KEY
            },

            body: JSON.stringify({
              user_id:
                user_id,

              username:
                username,

              email:
                email,

              password:
                password,

              initial_balance:
                initial_balance
            })

          }
        );


      const result =
        await response.json();


      if (!response.ok) {

        throw new Error(
          result.error ||
          "Customer creation failed"
        );

      }


      showSuccess(
        "customerSuccess",
        "Customer created successfully: " +
        user_id
      );


      document
        .getElementById(
          "customerUserId"
        )
        .value = "";

      document
        .getElementById(
          "customerUsername"
        )
        .value = "";

      document
        .getElementById(
          "customerEmail"
        )
        .value = "";

      document
        .getElementById(
          "customerPassword"
        )
        .value = "";

      document
        .getElementById(
          "customerBalance"
        )
        .value = "";


      await loadDashboard();

    }

    catch (error) {

      console.error(
        "CREATE CUSTOMER ERROR:",
        error
      );

      showError(
        "customerError",
        error.message ||
        "Customer creation failed"
      );

    }

  }


  /* ================================
     FUTURE FEATURES
  ================================= */

  function comingSoon(name) {

    alert(
      name +
      " module will be added next."
    );

  }


  /* ================================
     HTML SECURITY
  ================================= */

  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );

  }


  /* ================================
     CHECK EXISTING SESSION
  ================================= */

  async function checkSession() {

    try {

      const {
        data
      } =
        await supabaseClient
          .auth
          .getSession();


      if (
        data &&
        data.session
      ) {

        const {
          data: profile
        } =
          await supabaseClient
            .from("profiles")
            .select(
              "id,user_id,username,role,balance,status"
            )
            .eq(
              "id",
              data.session.user.id
            )
            .single();


        if (
          profile &&
          profile.role === "admin" &&
          profile.status === "active"
        ) {

          document
            .getElementById(
              "loginPage"
            )
            .classList
            .add("hidden");


          document
            .getElementById(
              "dashboardPage"
            )
            .classList
            .remove("hidden");


          document
            .getElementById(
              "adminInfo"
            )
            .textContent =
              "Logged in as: " +
              profile.username;


          await loadDashboard();

        }

      }

    }

    catch (error) {

      console.
