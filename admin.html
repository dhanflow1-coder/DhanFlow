
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DhanFlow Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px; min-height: 100vh;
      background: #0b1220; color: #f1f5f9;
      font: 16px Arial, sans-serif;
    }
    header, main {
      max-width: 650px; margin: 20px auto;
    }
    header {
      padding: 18px; background: #131e30;
      border-radius: 12px;
    }
    h1 { margin: 0 0 6px; font-size: 24px; }
    p { color: #b8c6d9; line-height: 1.5; }
    section {
      background: #131e30; padding: 20px;
      border: 1px solid #2b3b52; border-radius: 12px;
      margin-bottom: 16px;
    }
    label { display: block; margin: 14px 0; }
    input {
      width: 100%; padding: 12px; margin-top: 7px;
      background: #0b1423; color: white;
      border: 1px solid #40516b; border-radius: 8px;
    }
    button {
      width: 100%; padding: 12px; margin-top: 10px;
      border: 0; border-radius: 8px;
      background: #2563eb; color: white;
      font-weight: bold; cursor: pointer;
    }
    button:disabled { opacity: .6; }
    .secondary { background: #334155; }
    #message {
      white-space: pre-wrap; overflow-wrap: anywhere;
      line-height: 1.6; margin-top: 14px;
    }
    .hidden { display: none; }
    .error { color: #fca5a5; }
    .ok { color: #86efac; }
  </style>
</head>
<body>
  <header>
    <h1>DhanFlow Admin</h1>
    <p>Internal Wallet Management System</p>
  </header>

  <main>
    <section id="loginSection">
      <h2>Admin Login</h2>
      <form id="loginForm">
        <label>Email
          <input id="email" type="email" required autocomplete="username">
        </label>
        <label>Password
          <input id="password" type="password" required
                 autocomplete="current-password">
        </label>
        <button id="loginButton" type="submit">Login</button>
      </form>
      <div id="message" role="status" aria-live="polite"></div>
    </section>

    <section id="dashboard" class="hidden">
      <h2>Login সফল</h2>
      <p id="accountInfo"></p>
      <p>এখন Admin API সংযোগ পরীক্ষা করতে পারো।</p>
      <button id="apiButton">Test Admin API</button>
      <button id="logoutButton" class="secondary">Logout</button>
      <div id="apiMessage" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script>
    // Supabase Project URL এবং Publishable/anon key
    const SUPABASE_URL =
      "https://oxwjnravklpcdhfxibya.supabase.co";

    const SUPABASE_ANON_KEY =
      "PASTE_YOUR_PUBLISHABLE_KEY_HERE";

    const $ = id => document.getElementById(id);
    let client = null;

    function message(id, text, type = "") {
      const el = $(id);
      el.textContent = text;
      el.className = type;
    }

    function setLoggedIn(yes) {
      $("loginSection").classList.toggle("hidden", yes);
      $("dashboard").classList.toggle("hidden", !yes);
    }

    function init() {
      if (!window.supabase) {
        throw new Error(
          "Supabase library লোড হয়নি। ইন্টারনেট সংযোগ পরীক্ষা করো।"
        );
      }

      if (
        !SUPABASE_URL.startsWith("https://") ||
        SUPABASE_ANON_KEY === "PASTE_YOUR_PUBLISHABLE_KEY_HERE" ||
        !SUPABASE_ANON_KEY.trim()
      ) {
        throw new Error(
          "Supabase URL ও Publishable/anon key বসাও।"
        );
      }

      client = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );
    }

    $("loginForm").addEventListener("submit", async event => {
      event.preventDefault();

      const button = $("loginButton");
      button.disabled = true;
      button.textContent = "লগইন হচ্ছে…";
      message("message", "Supabase-এ সংযোগ করা হচ্ছে…");

      try {
        const email = $("email").value.trim();
        const password = $("password").value;

        const { data, error } =
          await client.auth.signInWithPassword({ email, password });

        if (error) throw error;
        if (!data.session) {
          throw new Error("Login session তৈরি হয়নি।");
        }

        $("accountInfo").textContent =
          "Signed in: " + (data.user.email || email);

        setLoggedIn(true);
        message("message", "");
      } catch (error) {
        setLoggedIn(false);
        message(
          "message",
          "Login ব্যর্থ: " + (error.message || String(error)),
          "error"
        );
      } finally {
        button.disabled = false;
        button.textContent = "Login";
      }
    });

    $("apiButton").addEventListener("click", async () => {
      const button = $("apiButton");
      button.disabled = true;
      message("apiMessage", "Admin API পরীক্ষা হচ্ছে…");

      try {
        const { data: sessionData, error: sessionError } =
          await client.auth.getSession();

        if (sessionError) throw sessionError;

        const token = sessionData.session?.access_token;
        if (!token) throw new Error("Login session পাওয়া যায়নি।");

        const response = await fetch(
          SUPABASE_URL + "/functions/v1/admin-api",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + token,
              "apikey": SUPABASE_ANON_KEY
            },
            body: JSON.stringify({
              action: "dashboard",
              data: {}
            })
          }
        );

        const body = await response.text();

        if (!response.ok) {
          throw new Error(
            "HTTP " + response.status + "\n" + body
          );
        }

        message(
          "apiMessage",
          "API response:\n" + body,
          "ok"
        );
      } catch (error) {
        message(
          "apiMessage",
          "API পরীক্ষা ব্যর্থ:\n" +
          (error.message || String(error)),
          "error"
        );
      } finally {
        button.disabled = false;
      }
    });

    $("logoutButton").addEventListener("click", async () => {
      try {
        await client.auth.signOut();
      } finally {
        setLoggedIn(false);
        $("password").value = "";
        message("message", "Logout সম্পন্ন হয়েছে।");
      }
    });

    window.addEventListener("error", event => {
      message("message", "JavaScript error: " + event.message, "error");
    });

    try {
      init();
    } catch (error) {
      message("message", error.message, "error");
    }
  </script>
</body>
</html>
