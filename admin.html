<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DhanFlow Admin Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #0f172a; display: flex; align-items: center; justify-content: center; height: 100vh; color: white; }
    .box { background: white; padding: 30px; border-radius: 12px; width: 350px; color: #0f172a; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h2 { text-align: center; color: #2563eb; margin-top: 0; }
    label { display: block; margin: 10px 0 5px; font-weight: bold; font-size: 14px; }
    input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; box-sizing: border-box; margin-bottom: 15px; }
    button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>

<div class="box">
  <h2>DhanFlow Admin</h2>
  <label>Email</label>
  <input type="email" id="email" placeholder="admin@dhanflow.com">
  
  <label>Password</label>
  <input type="password" id="password" placeholder="••••••••">
  
  <button onclick="handleLogin()">Login</button>
</div>

<script>
  const supabaseUrl = "https://oxwjnravklpcdhfxibya.supabase.co";
  const supabaseKey = "sb_publishable_e8SsrFVAkRKIoLVtgOXNGA_KHwMstRC";
  const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

  async function handleLogin() {
    alert("লগইন বাটন কাজ করছে!");

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      alert("দয়া করে ইমেইল এবং পাসওয়ার্ড দিন!");
      return;
    }

    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;

      alert("লগইন সফল হয়েছে! আইডি: " + data.user.id);
    } catch (err) {
      alert("লগইন ফেইলড: " + err.message);
    }
  }
</script>

</body>
</html>
