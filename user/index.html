<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <title>DhanFlow User</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial, sans-serif;
      background:#f4f7fb;
      color:#111827;
    }

    button,input{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    .hidden{
      display:none!important;
    }

    .app{
      max-width:520px;
      min-height:100vh;
      margin:auto;
      background:#f4f7fb;
    }

    /* LOGIN */

    #loginPage{
      min-height:100vh;
      padding:25px 18px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .login-card{
      width:100%;
      background:white;
      padding:25px;
      border-radius:22px;
      box-shadow:0 10px 35px rgba(0,0,0,.08);
    }

    .logo{
      font-size:28px;
      font-weight:800;
      color:#0b1220;
      margin-bottom:8px;
    }

    .subtitle{
      color:#64748b;
      font-size:14px;
      margin-bottom:25px;
    }

    label{
      display:block;
      font-size:13px;
      font-weight:bold;
      margin:15px 0 7px;
    }

    input{
      width:100%;
      padding:14px;
      border:1px solid #dbe2ea;
      border-radius:12px;
      outline:none;
    }

    input:focus{
      border-color:#0b1220;
    }

    .primary{
      width:100%;
      border:none;
      background:#0b1220;
      color:white;
      padding:14px;
      border-radius:12px;
      margin-top:20px;
      font-weight:bold;
    }

    .message{
      margin-top:12px;
      font-size:13px;
    }

    .error{
      color:#dc2626;
    }

    .success{
      color:#059669;
    }

    /* HEADER */

    .header{
      background:#0b1220;
      color:white;
      padding:18px;
      border-radius:0 0 24px 24px;
    }

    .header-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .header-logo{
      font-size:22px;
      font-weight:800;
    }

    .user-badge{
      background:#1e293b;
      color:#cbd5e1;
      padding:7px 10px;
      border-radius:20px;
      font-size:11px;
    }

    main{
      padding:16px;
      padding-bottom:90px;
    }

    /* BALANCE */

    .balance-card{
      background:linear-gradient(145deg,#111827,#0b1220);
      color:white;
      padding:22px;
      border-radius:20px;
      margin-bottom:15px;
    }

    .balance-label{
      font-size:13px;
      color:#cbd5e1;
    }

    .balance{
      font-size:34px;
      font-weight:800;
      margin-top:8px;
    }

    .user-info{
      color:#cbd5e1;
      font-size:12px;
      margin-top:8px;
    }

    /* ACTIONS */

    .actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .action{
      background:white;
      border:1px solid #e5e7eb;
      border-radius:17px;
      padding:17px;
      text-align:left;
      font-weight:bold;
      color:#111827;
    }

    .action span{
      display:block;
      color:#64748b;
      font-size:12px;
      margin-top:6px;
      font-weight:normal;
    }

    /* SECTIONS */

    .section{
      margin-top:22px;
    }

    .section-title{
      font-size:17px;
      font-weight:bold;
      margin-bottom:10px;
    }

    .card{
      background:white;
      border:1px solid #e5e7eb;
      border-radius:17px;
      padding:15px;
    }

    .row{
      display:flex;
      justify-content:space-between;
      gap:10px;
      padding:13px 0;
      border-bottom:1px solid #eef2f7;
    }

    .row:last-child{
      border-bottom:none;
    }

    .small{
      color:#64748b;
      font-size:12px;
      margin-top:4px;
    }

    .status{
      display:inline-block;
      padding:5px 8px;
      background:#eef2ff;
      border-radius:20px;
      font-size:10px;
      font-weight:bold;
      text-transform:uppercase;
    }

    .empty{
      text-align:center;
      color:#64748b;
      font-size:13px;
      padding:20px 5px;
    }

    /* BOTTOM NAV */

    .bottom-nav{
      position:fixed;
      bottom:0;
      left:50%;
      transform:translateX(-50%);
      width:min(520px,100%);
      background:white;
      border-top:1px solid #e5e7eb;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      padding:8px;
      z-index:5;
    }

    .nav-btn{
      border:none;
      background:transparent;
      padding:9px;
      color:#64748b;
      font-size:12px;
      font-weight:bold;
    }

    .nav-btn.active{
      color:#111827;
    }

    /* VIEWS */

    .view{
      display:none;
    }

    .view.active{
      display:block;
    }

    /* MODAL */

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.55);
      z-index:20;
      display:flex;
      align-items:flex-end;
    }

    .modal-box{
      width:min(520px,100%);
      background:white;
      border-radius:22px 22px 0 0;
      padding:20px;
      max-height:90vh;
      overflow:auto;
    }

    .modal-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:8px;
    }

    .close{
      width:35px;
      height:35px;
      border:none;
      background:#f1f5f9;
      border-radius:50%;
      font-size:20px;
    }

    .logout{
      width:100%;
      margin-top:15px;
      padding:13px;
      border:none;
      border-radius:12px;
      background:#fee2e2;
      color:#991b1b;
      font-weight:bold;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- LOGIN -->

  <div id="loginPage">

    <div class="login-card">

      <div class="logo">DhanFlow</div>

      <div class="subtitle">
        Secure User Wallet
      </div>

      <label>Email</label>

      <input
        id="email"
        type="email"
        placeholder="Enter your email"
      >

      <label>Password</label>

      <input
        id="password"
        type="password"
        placeholder="Enter your password"
      >

      <button
        id="loginBtn"
        class="primary"
      >
        Login
      </button>

      <div
        id="loginMessage"
        class="message"
      ></div>

    </div>

  </div>


  <!-- USER APP -->

  <div id="userApp" class="hidden">

    <header class="header">

      <div class="header-row">

        <div class="header-logo">
          DhanFlow
        </div>

        <div class="user-badge">
          USER
        </div>

      </div>

    </header>


    <main>

      <!-- HOME -->

      <div
        id="homeView"
        class="view active"
      >

        <div class="balance-card">

          <div class="balance-label">
            Available Balance
          </div>

          <div
            id="balance"
            class="balance"
          >
            ₹0.00
          </div>

          <div
            id="userInfo"
            class="user-info"
          >
            Loading...
          </div>

        </div>


        <div class="actions">

          <button
            class="action"
            onclick="openTransfer()"
          >
            💸 Send Money

            <span>
              Transfer to another user
            </span>

          </button>


          <button
            class="action"
            onclick="openWithdrawal()"
          >
            🏦 Withdraw

            <span>
              Request bank withdrawal
            </span>

          </button>

        </div>


        <div class="section">

          <div class="section-title">
            Recent Transactions
          </div>

          <div
            id="recentTransactions"
            class="card"
          >
            <div class="empty">
              Loading...
            </div>
          </div>

        </div>

      </div>


      <!-- HISTORY -->

      <div
        id="historyView"
        class="view"
      >

        <div class="section">

          <div class="section-title">
            Transaction History
          </div>

          <div
            id="transactionHistory"
            class="card"
          >
            <div class="empty">
              Loading...
            </div>
          </div>

        </div>


        <div class="section">

          <div class="section-title">
            Withdrawal History
          </div>

          <div
            id="withdrawalHistory"
            class="card"
          >
            <div class="empty">
              Loading...
            </div>
          </div>

        </div>

      </div>


      <!-- PROFILE -->

      <div
        id="profileView"
        class="view"
      >

        <div class="section">

          <div class="section-title">
            My Profile
          </div>

          <div
            id="profileCard"
            class="card"
          >
            Loading...
          </div>

        </div>


        <button
          id="logoutBtn"
          class="logout"
        >
          Logout
        </button>

      </div>

    </main>


    <!-- BOTTOM NAV -->

    <div class="bottom-nav">

      <button
        class="nav-btn active"
        data-view="homeView"
      >
        🏠<br>
        Home
      </button>

      <button
        class="nav-btn"
        data-view="historyView"
      >
        📜<br>
        History
      </button>

      <button
        class="nav-btn"
        data-view="profileView"
      >
        👤<br>
        Profile
      </button>

    </div>

  </div>


  <!-- MODAL -->

  <div
    id="modal"
    class="modal hidden"
  >

    <div class="modal-box">

      <div class="modal-head">

        <h2 id="modalTitle">
          DhanFlow
        </h2>

        <button
          class="close"
          onclick="closeModal()"
        >
          ×
        </button>

      </div>

      <div
        id="modalContent"
      ></div>

    </div>

  </div>

</div>


<script>

/* ==============================
   SUPABASE
============================== */

const SUPABASE_URL =
"https://oxwjnravklpcdhfxibya.supabase.co";

const SUPABASE_KEY =
"sb_publishable_e8SsrFVAkRKIoLVtgOXNGA_KHwMstRC";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ==============================
   GLOBAL
============================== */

let currentUser = null;
let currentProfile = null;


/* ==============================
   HELPERS
============================== */

function money(value){

  return "₹" +
    Number(value || 0).toLocaleString(
      "en-IN",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );

}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function dateTime(value){

  if(!value) return "";

  return new Date(value).toLocaleString(
    "en-IN",
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );

}


/* ==============================
   LOGIN
============================== */

document
.getElementById("loginBtn")
.addEventListener(
  "click",
  login
);


async function login(){

  const email =
    document
    .getElementById("email")
    .value
    .trim();

  const password =
    document
    .getElementById("password")
    .value;


  if(!email || !password){

    showLoginMessage(
      "Please enter email and password.",
      "error"
    );

    return;
  }


  const button =
    document.getElementById("loginBtn");

  button.disabled = true;

  button.textContent = "Logging in...";


  const { data, error } =
    await supabaseClient.auth.signInWithPassword({

      email:email,

      password:password

    });


  button.disabled = false;

  button.textContent = "Login";


  if(error){

    showLoginMessage(
      error.message,
      "error"
    );

    return;
  }


  currentUser = data.user;

  await loadUser();

}


function showLoginMessage(
  message,
  type
){

  const box =
    document.getElementById(
      "loginMessage"
    );

  box.className =
    "message " + type;

  box.textContent =
    message;

}


/* ==============================
   LOAD USER
============================== */

async function loadUser(){

  const {
    data:{
      user
    }
  } =
  await supabaseClient
    .auth
    .getUser();


  if(!user){

    showLogin();

    return;
  }


  currentUser = user;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id",user.id)
    .single();


  if(error){

    alert(
      "Profile load failed: " +
      error.message
    );

    return;
  }


  currentProfile = data;


  /*
    USER APP ONLY
  */

  if(data.role !== "customer"){

    await supabaseClient
      .auth
      .signOut();

    alert(
      "This application is only for users."
    );

    showLogin();

    return;
  }


  if(data.status !== "active"){

    await supabaseClient
      .auth
      .signOut();

    alert(
      "Your account is blocked."
    );

    showLogin();

    return;
  }


  document
    .getElementById("loginPage")
    .classList.add("hidden");


  document
    .getElementById("userApp")
    .classList.remove("hidden");


  updateProfile();

  await loadTransactions();

}


/* ==============================
   PROFILE
============================== */

function updateProfile(){

  document
    .getElementById("balance")
    .textContent =
      money(currentProfile.balance);


  document
    .getElementById("userInfo")
    .textContent =
      currentProfile.username +
      " • " +
      currentProfile.user_id;


  document
    .getElementById("profileCard")
    .innerHTML = `

      <div class="row">

        <span>User ID</span>

        <b>
          ${escapeHTML(
            currentProfile.user_id
          )}
        </b>

      </div>


      <div class="row">

        <span>Username</span>

        <b>
          ${escapeHTML(
            currentProfile.username
          )}
        </b>

      </div>


      <div class="row">

        <span>Email</span>

        <b>
          ${escapeHTML(
            currentUser.email
          )}
        </b>

      </div>


      <div class="row">

        <span>Balance</span>

        <b>
          ${money(
            currentProfile.balance
          )}
        </b>

      </div>


      <div class="row">

        <span>Status</span>

        <span class="status">
          ${escapeHTML(
            currentProfile.status
          )}
        </span>

      </div>

    `;

}


/* ==============================
   TRANSACTIONS
============================== */

async function loadTransactions(){

  const {
    data:transactions,
    error:txError
  } =
  await supabaseClient
    .from("transactions")
    .select("*")
    .or(
      `sender_id.eq.${currentProfile.id},receiver_id.eq.${currentProfile.id}`
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(txError){

    console.error(txError);

  }


  const {
    data:withdrawals,
    error:wdError
  } =
  await supabaseClient
    .from("withdrawals")
    .select("*")
    .eq(
      "user_id",
      currentProfile.id
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(wdError){

    console.error(wdError);

  }


  renderRecent(
    transactions || []
  );


  renderTransactions(
    transactions || []
  );


  renderWithdrawals(
    withdrawals || []
  );

}


function renderRecent(rows){

  const box =
    document.getElementById(
      "recentTransactions"
    );


  if(!rows.length){

    box.innerHTML =
      `<div class="empty">
        No transactions yet.
      </div>`;

    return;
  }


  box.innerHTML =
    rows
      .slice(0,5)
      .map(
        transactionHTML
      )
      .join("");

}


function transactionHTML(t){

  return `

    <div class="row">

      <div>

        <b>
          ${escapeHTML(t.type)}
        </b>

        <div class="small">
          ${escapeHTML(
            t.transaction_id
          )}
        </div>

        <div class="small">
          ${dateTime(
            t.created_at
          )}
        </div>

      </div>


      <div style="text-align:right">

        <b>
          ${money(t.amount)}
        </b>

        <div>

          <span class="status">
            ${escapeHTML(
              t.status
            )}
          </span>

        </div>

      </div>

    </div>

  `;

}


function renderTransactions(rows){

  const box =
    document.getElementById(
      "transactionHistory"
    );


  if(!rows.length){

    box.innerHTML =
      `<div class="empty">
        No transactions yet.
      </div>`;

    return;
  }


  box.innerHTML =
    rows
      .map(
        transactionHTML
      )
      .join("");

}


function renderWithdrawals(rows){

  const box =
    document.getElementById(
      "withdrawalHistory"
    );


  if(!rows.length){

    box.innerHTML =
      `<div class="empty">
        No withdrawal requests yet.
      </div>`;

    return;
  }


  box.innerHTML =
    rows
      .map(
        w => `

        <div class="row">

          <div>

            <b>
              ${escapeHTML(
                w.bank_name
              )}
            </b>

            <div class="small">
              ${escapeHTML(
                w.withdrawal_id
              )}
            </div>

            <div class="small">
              ${dateTime(
                w.created_at
              )}
            </div>

          </div>


          <div style="text-align:right">

            <b>
              ${money(w.amount)}
            </b>

            <div>

              <span class="status">
                ${escapeHTML(
                  w.status
                )}
              </span>

            </div>

          </div>

        </div>

      `
      )
      .join("");

}


/* ==============================
   SEND MONEY
============================== */

function openTransfer(){

  document
    .getElementById("modalTitle")
    .textContent =
      "Send Money";


  document
    .getElementById("modalContent")
    .innerHTML = `

      <p class="small">
        Transfer money to another
        DhanFlow user.
      </p>


      <label>
        Receiver User ID
      </label>

      <input
        id="receiverId"
        placeholder="Example: Mala112"
      >


      <label>
        Amount
      </label>

      <input
        id="transferAmount"
        type="number"
        min="1"
        step="0.01"
        placeholder="₹0.00"
      >


      <button
        id="transferBtn"
        class="primary"
      >
        Submit Transfer
      </button>


      <div
        id="transferMessage"
        class="message"
      ></div>

    `;


  document
    .getElementById("transferBtn")
    .onclick =
      submitTransfer;


  document
    .getElementById("modal")
    .classList
    .remove("hidden");

}


async function submitTransfer(){

  const receiver =
    document
      .getElementById("receiverId")
      .value
      .trim();


  const amount =
    Number(
      document
        .getElementById(
          "transferAmount"
        )
        .value
    );


  if(!receiver){

    modalMessage(
      "Please enter receiver User ID.",
      "error"
    );

    return;
  }


  if(!amount || amount <= 0){

    modalMessage(
      "Please enter a valid amount.",
      "error"
    );

    return;
  }


  if(
    amount >
    Number(currentProfile.balance)
  ){

    modalMessage(
      "Insufficient balance.",
      "error"
    );

    return;
  }


  const button =
    document.getElementById(
      "transferBtn"
    );


  button.disabled = true;

  button.textContent =
    "Submitting...";


  const {
    data,
    error
  } =
  await supabaseClient
    .rpc(
      "create_transfer_request",
      {
        p_receiver_user_id:
          receiver,

        p_amount:
          amount
      }
    );


  button.disabled = false;

  button.textContent =
    "Submit Transfer";


  if(error){

    modalMessage(
      error.message,
      "error"
    );

    return;
  }


  modalMessage(
    "Transfer request submitted successfully.",
    "success"
  );


  setTimeout(
    async()=>{

      closeModal();

      await loadUser();

    },
    1000
  );

}


/* ==============================
   WITHDRAWAL
============================== */

function openWithdrawal(){

  document
    .getElementById("modalTitle")
    .textContent =
      "Bank Withdrawal";


  document
    .getElementById("modalContent")
    .innerHTML = `

      <p class="small">
        Submit a bank withdrawal request.
      </p>


      <label>
        Bank Name
      </label>

      <input
        id="bankName"
        placeholder="Bank name"
      >


      <label>
        Account Holder
      </label>

      <input
        id="accountHolder"
        placeholder="Account holder name"
      >


      <label>
        Account Number
      </label>

      <input
        id="accountNumber"
        inputmode="numeric"
        placeholder="Account number"
      >


      <label>
        IFSC
      </label>

      <input
        id="ifsc"
        placeholder="Example: SBIN0000001"
      >


      <label>
        Amount
      </label>

      <input
        id="withdrawAmount"
        type="number"
        min="1"
        step="0.01"
        placeholder="₹0.00"
      >


      <button
        id="withdrawBtn"
        class="primary"
      >
        Submit Withdrawal
      </button>


      <div
        id="withdrawMessage"
        class="message"
      ></div>

    `;


  document
    .getElementById("withdrawBtn")
    .onclick =
      submitWithdrawal;


  document
    .getElementById("modal")
    .classList
    .remove("hidden");

}


async function submitWithdrawal(){

  const bankName =
    document
      .getElementById("bankName")
      .value
      .trim();


  const accountHolder =
    document
      .getElementById("accountHolder")
      .value
      .trim();


  const accountNumber =
    document
      .getElementById("accountNumber")
      .value
      .trim();


  const ifsc =
    document
      .getElementById("ifsc")
      .value
      .trim();


  const amount =
    Number(
      document
        .getElementById(
          "withdrawAmount"
        )
        .value
    );


  if(
    !bankName ||
    !accountHolder ||
    !accountNumber ||
    !ifsc
  ){

    modalMessage(
      "Please fill all bank details.",
      "error"
    );

    return;
  }


  if(!amount || amount <= 0){

    modalMessage(
      "Please enter a valid amount.",
      "error"
    );

    return;
  }


  if(
    amount >
    Number(currentProfile.balance)
  ){

    modalMessage(
      "Insufficient balance.",
      "error"
    );

    return;
  }


  const button =
    document.getElementById(
      "withdrawBtn"
    );


  button.disabled = true;

  button.textContent =
    "Submitting...";


  const {
    data,
    error
  } =
  await supabaseClient
    .rpc(
      "create_withdrawal_request",
      {
        p_bank_name:
          bankName,

        p_account_holder:
          accountHolder,

        p_account_number:
          accountNumber,

        p_ifsc:
          ifsc,

        p_amount:
          amount
      }
    );


  button.disabled = false;

  button.textContent =
    "Submit Withdrawal";


  if(error){

    modalMessage(
      error.message,
      "error"
    );

    return;
  }


  modalMessage(
    "Withdrawal request submitted successfully.",
    "success"
  );


  setTimeout(
    async()=>{

      closeModal();

      await loadUser();

    },
    1000
  );

}


/* ==============================
   MODAL
============================== */

function modalMessage(
  message,
  type
){

  const box =
    document.getElementById(
      "transferMessage"
    ) ||
    document.getElementById(
      "withdrawMessage"
    );


  if(box){

    box.className =
      "message " + type;

    box.textContent =
      message;

  }

}


function closeModal(){

  document
    .getElementById("modal")
    .classList
    .add("hidden");

}


/* ==============================
   NAVIGATION
============================== */

document
  .querySelectorAll(".nav-btn")
  .forEach(
    button => {

      button.addEventListener(
        "click",
        ()=>{

          document
            .querySelectorAll(
              ".nav-btn"
            )
            .forEach(
              b =>
                b.classList
                 .remove("active")
            );


          button
            .classList
            .add("active");


          document
            .querySelectorAll(".view")
            .forEach(
              view =>
                view.classList
                    .remove("active")
            );


          document
            .getElementById(
              button.dataset.view
            )
            .classList
            .add("active");

        }
      );

    }
  );


/* ==============================
   LOGOUT
============================== */

document
  .getElementById("logoutBtn")
  .addEventListener(
    "click",
    async()=>{

      await supabaseClient
        .auth
        .signOut();

      showLogin();

    }
  );


function showLogin(){

  document
    .getElementById("userApp")
    .classList
    .add("hidden");


  document
    .getElementById("loginPage")
    .classList
    .remove("hidden");


  document
    .getElementById("email")
    .value = "";


  document
    .getElementById("password")
    .value = "";

}


/* ==============================
   AUTO LOGIN
============================== */

supabaseClient
  .auth
  .onAuthStateChange(
    async(event)=>{

      if(event === "SIGNED_IN"){

        await loadUser();

      }

    }
  );


(async()=>{

  const {
    data:{
      session
    }
  } =
  await supabaseClient
    .auth
    .getSession();


  if(session){

    await loadUser();

  }

})();

</script>

</body>
</html>
